<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#1E293B">
    <title>ServerLuxe</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="ui.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script>
        // Native Terminal ANSI & Color Parser
        window.renderAnsiTerminal = function(text) {
            if (!text) return '';
            let s = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            s = s.replace(/\x1b\[[0-9;]*[HfABCDsuJKnhilmpqr]/g, '');
            const colorMap = {
                '0': '</span>',
                '1': '<span style="font-weight:bold;">',
                '2': '<span style="opacity:0.75;">',
                '3': '<span style="font-style:italic;">',
                '4': '<span style="text-decoration:underline;">',
                '30': '<span style="color:#475569;">',
                '31': '<span style="color:#f87171;">',
                '32': '<span style="color:#4ade80;">',
                '33': '<span style="color:#fbbf24;">',
                '34': '<span style="color:#60a5fa;">',
                '35': '<span style="color:#c084fc;">',
                '36': '<span style="color:#22d3ee;">',
                '37': '<span style="color:#e2e8f0;">',
                '90': '<span style="color:#64748b;">',
                '91': '<span style="color:#ef4444;">',
                '92': '<span style="color:#22c55e;">',
                '93': '<span style="color:#f59e0b;">',
                '94': '<span style="color:#3b82f6;">',
                '95': '<span style="color:#a855f7;">',
                '96': '<span style="color:#06b6d4;">',
                '97': '<span style="color:#ffffff;">',
                '40': '<span style="background-color:#1e293b;">',
                '41': '<span style="background-color:#7f1d1d;">',
                '42': '<span style="background-color:#14532d;">',
                '43': '<span style="background-color:#78350f;">',
                '44': '<span style="background-color:#1e3a8a;">',
                '45': '<span style="background-color:#581c87;">',
                '46': '<span style="background-color:#164e63;">',
                '47': '<span style="background-color:#334155;">'
            };
            s = s.replace(/\x1b\[([0-9;]+)m/g, function(match, codes) {
                const parts = codes.split(';');
                let out = '';
                for (let p of parts) {
                    if (colorMap[p]) out += colorMap[p];
                }
                return out;
            });
            return s;
        };
    </script>

    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0f172a;
            --bg-surface: #1e293b;
            --bg-elevated: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #a855f7;
            /* Purple accent for FTP */
            --danger: #ef4444;
            --success: #10b981;
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            line-height: 1.5;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .safe-area-inset {
            padding-top: env(safe-area-inset-top);
        }

        .app-header {
            padding: 1.25rem;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .main-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 1.25rem;
            padding-bottom: 5rem;
        }

        .card {
            background: var(--bg-surface);
            border-radius: 1rem;
            padding: 1.25rem;
            border: 1px solid var(--border);
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            border: none;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            gap: 0.5rem;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            width: 100%;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            color: #fff;
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .input-control {
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            color: #fff;
            font-family: inherit;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .input-control:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            overflow: hidden;
            margin-bottom: 1rem;
            box-shadow: 0 4px 14px 0 rgba(0, 0, 0, 0.2);
        }

        .btn-group-item {
            border: none;
            border-radius: 0;
            border-right: 1px solid var(--border);
            padding: 0.5rem 0.6rem;
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: transparent;
            color: var(--text-primary);
            cursor: pointer;
            text-decoration: none;
            font-size: 0.65rem;
            font-weight: 600;
            line-height: 1;
            transition: all 0.2s;
            font-family: inherit;
            flex: 1;
        }

        .btn-group-item:hover {
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
        }

        .btn-primary-item {
            background: var(--accent);
            color: #000;
        }

        .btn-primary-item:hover {
            background: var(--accent);
            color: #000;
        }

        .btn-group>*:last-child {
            border-right: none;
        }

        @media (max-width: 768px) {
            .btn-group-item .btn-text {
                display: none;
            }
        }

        .server-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: var(--bg-elevated);
            border-radius: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 2000;
            display: flex;
            align-items: flex-end;
        }

        .modal-card {
            background: var(--bg-surface);
            width: 100%;
            border-radius: 1.5rem 1.5rem 0 0;
            padding: 2rem;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-enter {
            animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .modal-leave {
            animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideDown {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(100%);
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .badge {
            font-size: 0.6rem;
            font-weight: 800;
            padding: 0.25rem 0.5rem;
            border-radius: 0.4rem;
            text-transform: uppercase;
        }

        .badge-accent {
            background: rgba(168, 85, 247, 0.1);
            color: var(--accent);
        }

        [x-cloak] {
            display: none !important;
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .path-breadcrumb {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 0.5rem;
            margin-bottom: 1rem;
            font-size: 0.8rem;
            color: var(--accent);
            font-weight: 700;
            border-bottom: 1px solid var(--border);
        }

        .path-breadcrumb span {
            cursor: pointer;
        }

        /* Native Terminal Window Styling */
        .native-terminal-card {
            background: #090d16 !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 12px !important;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.05) !important;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .native-terminal-card.is-maximized {
            width: 100vw !important;
            height: 100vh !important;
            max-width: 100vw !important;
            max-height: 100vh !important;
            border-radius: 0 !important;
            margin: 0 !important;
            position: fixed !important;
            inset: 0 !important;
            z-index: 10001 !important;
        }
        .term-titlebar {
            background: linear-gradient(180deg, #1e2638 0%, #151b28 100%);
            border-bottom: 1px solid rgba(0, 0, 0, 0.6);
            height: 38px;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            user-select: none;
            -webkit-user-select: none;
        }
        .term-lights {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .term-light {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: 1px solid rgba(0, 0, 0, 0.3);
            transition: all 0.15s ease;
            color: rgba(0, 0, 0, 0.7);
            font-size: 8px;
            font-weight: 900;
            line-height: 1;
            padding: 0;
        }
        .term-light-close { background: #ff5f56; }
        .term-light-close:hover { background: #e0443e; }
        .term-light-min { background: #ffbd2e; }
        .term-light-min:hover { background: #dea123; }
        .term-light-max { background: #27c93f; }
        .term-light-max:hover { background: #1aab29; }
        .term-title {
            color: #94a3b8;
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
        }
        .term-tabs-bar {
            background: #0f1420;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0 10px;
            display: flex;
            align-items: center;
            gap: 4px;
            height: 32px;
            min-height: 32px;
            overflow-x: auto;
        }
        .term-tab-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px 6px 0 0;
            color: #94a3b8;
            font-size: 0.72rem;
            padding: 4px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            border-bottom: none;
            font-family: 'JetBrains Mono', Consolas, Monaco, monospace;
        }
        .term-tab-pill.active {
            background: #060911;
            color: #22d3ee;
            border-color: rgba(34, 211, 238, 0.3);
            font-weight: 600;
        }
        .term-screen {
            background: #060911;
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            line-height: 1.55;
            color: #e2e8f0;
            cursor: text;
        }
        .term-prompt-line {
            display: flex;
            align-items: center;
            gap: 0;
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
        }
        .term-user { color: #34d399; font-weight: 700; }
        .term-at { color: #64748b; }
        .term-host { color: #38bdf8; font-weight: 700; }
        .term-colon { color: #64748b; margin-right: 4px; }
        .term-path { color: #a78bfa; font-weight: 700; margin-right: 6px; }
        .term-symbol { color: #f59e0b; font-weight: 800; margin-right: 8px; }
        .term-active-input {
            background: transparent;
            border: none;
            outline: none;
            color: #f8fafc;
            font-family: inherit;
            font-size: 13px;
            flex: 1;
            padding: 0;
            margin: 0;
            caret-color: #22d3ee;
        }
        .term-cursor-block {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: #22d3ee;
            vertical-align: text-bottom;
            animation: termBlink 1s step-end infinite;
        }
        @keyframes termBlink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
        .term-badge-online {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
        }
        .term-badge-offline {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
        }
        .term-quick-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            color: #94a3b8;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.68rem;
            padding: 2px 7px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .term-quick-btn:hover {
            background: rgba(34, 211, 238, 0.15);
            color: #22d3ee;
            border-color: rgba(34, 211, 238, 0.3);
        }
    </style>
</head>

<body x-data="ftpApp">

    <header class="app-header safe-area-inset">
        <div class="flex items-center gap-2">
            <h1 @click="window.location.href='https://bycomsolutions.com'"
                style="font-size: 1.25rem; font-weight: 800; color: var(--accent); cursor: pointer;">FMLuxe</h1>

            <template x-if="currentServer">
                <span class="badge badge-accent" x-text="currentServer.name"></span>
            </template>
        </div>
        <div style="display: flex; gap: 0.5rem;">
            <button onclick="switchApp('index.html')" class="btn btn-ghost" style="padding: 0.5rem;"
                title="Switch to SQL">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
            </button>
            <button @click="openServerManager = true" class="btn btn-ghost" style="padding: 0.5rem;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    style="pointer-events: none;">
                    <rect x="3" y="3" width="7" height="7"></rect>
                    <rect x="14" y="3" width="7" height="7"></rect>
                    <rect x="14" y="14" width="7" height="7"></rect>
                    <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
            </button>

        </div>
    </header>

    <main class="main-scroll">
        <!-- Dashboard / Connect Screen -->
        <template x-if="!currentServer">
            <div>
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h2 style="font-weight: 800; font-size: 1.25rem;">Saved Nodes</h2>
                    <div style="display:flex; gap: 0.5rem;">
                        <button @click="startQRScanner" class="btn btn-primary"
                            style="padding: 0.4rem 0.6rem; font-size: 0.65rem; background: #22d3ee; color: #000;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5">
                                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                                <path d="M7 7h10v10H7z"></path>
                            </svg>
                            SCAN
                        </button>
                        <button @click="exportNodes" class="btn btn-ghost"
                            style="padding: 0.4rem 0.6rem; font-size: 0.65rem;">EXPORT</button>
                        <button @click="document.getElementById('importNodesInput').click()" class="btn btn-ghost"
                            style="padding: 0.4rem 0.6rem; font-size: 0.65rem;">IMPORT</button>
                    </div>
                </div>

                <template x-if="servers.length === 0">
                    <div style="text-align: center; padding-top: 4rem;">
                        <div
                            style="width: 80px; height: 80px; background: rgba(168, 85, 247, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; color: var(--accent);">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M20 16V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10"></path>
                                <path d="M4 18v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"></path>
                                <path d="M12 14v4"></path>
                                <path d="M16 10H8"></path>
                            </svg>
                        </div>
                        <h2 style="font-weight: 800; margin-bottom: 0.5rem;">Ready to Connect</h2>
                        <p style="color: var(--text-secondary); margin-bottom: 2rem;">Add your File Manager Endpoint to
                            get started.
                        </p>
                        <button @click="startQRScanner" class="btn btn-primary"
                            style="width: 100%; max-width: 250px; margin: 0 auto; background: #22d3ee; color: #000;">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
                                <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
                                <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
                                <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
                                <path d="M7 7h10v10H7z"></path>
                            </svg>
                            SCAN CONNECTION QR
                        </button>
                    </div>
                </template>


                <div style="display: flex; flex-direction: column; gap: 0.75rem;">
                    <template x-for="(s, idx) in servers">
                        <div class="card"
                            style="padding: 1rem; margin-bottom: 0; border-left: 4px solid var(--accent); cursor:pointer;"
                            @click="selectServer(s)">
                            <div style="font-weight: 800; font-size: 1.1rem; color: #fff;" x-text="s.name"></div>
                            <div style="font-size: 0.7rem; color: var(--text-secondary); margin-top: 0.25rem; font-family: monospace; opacity: 0.7;"
                                x-text="s.url"></div>
                            <div
                                style="display: flex; gap: 0.75rem; margin-top: 1rem; padding-top: 0.75rem; border-top: 1px solid var(--border);">
                                <button @click.stop="editServer(idx)" class="btn btn-ghost"
                                    style="flex: 1; font-size: 0.75rem; padding: 0.5rem; justify-content: center; color: var(--accent); border-color: rgba(168,85,247,0.3);">
                                    EDIT
                                </button>
                                <button @click.stop="removeServer(idx)" class="btn btn-ghost"
                                    style="flex: 1; font-size: 0.75rem; padding: 0.5rem; justify-content: center; color: #ff6b6b; border-color: rgba(239,68,68,0.3);">
                                    REMOVE
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <div style="margin-top:2rem;">
                    <button
                        @click="tempServer = { name: '', url: '', apiKey: '' }; editingServerIdx = null; showAddServer = true"
                        class="btn btn-primary" style="color:#fff;">+ ADD NODE</button>
                </div>
            </div>
        </template>

        <!-- Main Manager view -->
        <template x-if="currentServer">
            <div x-cloak>
                <div class="card" style="padding: 1rem;">
                    <div style="display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 0.5rem;">
                        <template x-if="!pathEditing">
                            <div class="path-breadcrumb"
                                style="width: 100%; white-space: nowrap; overflow-x: auto; padding-bottom:0.5rem; display: flex; align-items: center;">
                                <span @click="navigateTo('/')">/</span>
                                <template x-for="(segment, index) in pathSegments" :key="index">
                                    <span style="display:inline-flex; align-items:center; gap:0.25rem;">
                                        <span style="opacity:0.4;">/</span>
                                        <span @click="navigateToSegment(index)" x-text="segment"></span>
                                    </span>
                                </template>
                                <button type="button" @click="enablePathEdit()" class="btn btn-ghost" style="padding: 0.15rem 0.45rem; border: none; opacity: 0.6; margin-left: auto; flex-shrink: 0;" title="Edit Path / Go to file or folder">
                                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                                </button>
                            </div>
                        </template>
                        <template x-if="pathEditing">

                    <span><span x-text="terminalUser"></span>@<span x-text="terminalHost"></span>: <span style="color:#e2e8f0;" x-text="terminalTabs[terminalActiveTab]?.cwd || terminalCwd || '~'"></span></span>

                <button type="button" @click.stop="addTerminalTab()" class="term-quick-btn" title="New Terminal Tab" style="padding: 2px 8px; font-weight: bold;">+ New Tab</button>
            </div>

            <!-- Terminal Warning Banner if disabled -->
            <div x-show="!terminalEnabled" style="background: rgba(239, 68, 68, 0.15); border-bottom: 1px solid rgba(239, 68, 68, 0.3); padding: 0.5rem 1rem; display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; color: #fca5a5;">
                <div class="flex items-center gap-2">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span>Terminal is currently disabled. Click <strong>Enable</strong> to allow shell command execution.</span>
                </div>
                <button type="button" @click.stop="toggleTerminal(true)" class="btn btn-primary" style="padding: 0.2rem 0.6rem; font-size: 0.72rem; background: var(--danger); border-color: var(--danger); color: #fff;">Enable Now</button>
            </div>

            <!-- Native Terminal Body & Screen -->
            <div 
                x-ref="terminalBody" 
                class="term-screen"
                @click="focusTerminal()"
            >
                <template x-for="(log, idx) in (terminalTabs[terminalActiveTab]?.logs || [])" :key="idx">
                    <div style="margin-bottom: 3px; word-break: break-all;">
                        <!-- System banner -->
                        <template x-if="log.type === 'system-banner'">
                            <div style="color: #64748b; font-size: 12px; margin-bottom: 8px; border-left: 2px solid #22d3ee; padding-left: 8px;" x-text="log.text"></div>
                        </template>

                        <!-- Command executed line -->
                        <template x-if="log.type === 'cmd'">
                            <div class="term-prompt-line" style="margin-bottom: 2px;">
                                <span class="term-user" x-text="log.user || terminalUser"></span>
                                <span class="term-at">@</span>
                                <span class="term-host" x-text="log.hostname || terminalHost"></span>
                                <span class="term-colon">:</span>
                                <span class="term-path" x-text="log.cwd ? (log.cwd.split('/').pop() || '/') : '~'"></span>
                                <span class="term-symbol">$</span>
                                <span style="color: #f8fafc; font-weight: 600;" x-text="log.text"></span>
                            </div>
                        </template>

                        <!-- Standard Output (with ANSI colors) -->
                        <template x-if="log.type === 'stdout'">
                            <div style="color: #e2e8f0; white-space: pre-wrap;" x-html="window.renderAnsiTerminal(log.text)"></div>
                        </template>

                        <!-- Standard Error -->

                        <template x-if="log.type === 'error'">
                            <div style="color: #ef4444; font-weight: 600;" x-text="log.text"></div>

                        <!-- Exit code badge for non-zero codes -->
                        <template x-if="log.type === 'exit-info'">

                                [Process exited with code <span x-text="log.exitCode"></span>]

                </template>

                <!-- Active In-Progress Prompt Line (Native Terminal Look) -->
                <div class="term-prompt-line">
                    <span class="term-user" x-text="terminalUser"></span>
                    <span class="term-at">@</span>
                    <span class="term-host" x-text="terminalHost"></span>
                    <span class="term-colon">:</span>
                    <span class="term-path" x-text="terminalTabs[terminalActiveTab]?.cwd ? (terminalTabs[terminalActiveTab].cwd.split('/').pop() || '/') : (terminalCwd ? (terminalCwd.split('/').pop() || '/') : '~')"></span>

                        x-ref="terminalCmdInput"

                        @keydown.down.prevent="navigateHistory('down')"

                        autocapitalize="off"
                        spellcheck="false"
                        autocomplete="off"

                </div>
            </div>

            <!-- Terminal Footer Status Bar & Quick Actions -->
            <div style="background: #0f1420; border-top: 1px solid rgba(255, 255, 255, 0.06); padding: 5px 14px; display: flex; align-items: center; justify-content: space-between; font-size: 0.7rem; color: #64748b; font-family: -apple-system, BlinkMacSystemFont, monospace;">
                <div class="flex items-center gap-1" style="overflow-x: auto;">
                    <span style="opacity: 0.6; margin-right: 4px;">Quick:</span>
                    <button type="button" @click.stop="runQuickCmd('pwd')" class="term-quick-btn">pwd</button>
                    <button type="button" @click.stop="runQuickCmd('ls -la')" class="term-quick-btn">ls -la</button>
                    <button type="button" @click.stop="runQuickCmd('whoami')" class="term-quick-btn">whoami</button>
                    <button type="button" @click.stop="runQuickCmd('git status')" class="term-quick-btn">git status</button>
                    <button type="button" @click.stop="runQuickCmd('uptime')" class="term-quick-btn">uptime</button>
                    <button type="button" @click.stop="runQuickCmd('df -h')" class="term-quick-btn">df -h</button>
                    <button type="button" @click.stop="runQuickCmd('php -v')" class="term-quick-btn">php -v</button>
                </div>
                <div class="flex items-center gap-3 mobile-hide" style="flex-shrink: 0; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;">
                    <span>UTF-8</span>

                    <span x-text="(terminalTabs[terminalActiveTab]?.cwd || terminalCwd || '/')"></span>
                </div>
            </div>

    <!-- Global hidden inputs -->

    <input type="file" id="importNodesInput" @change="importNodes($event)" style="display:none;" accept=".json">

    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script>

        window.addEventListener('hardwareBackPress', (e) => {
            const app = document.querySelector('[x-data="ftpApp"]').__x.$data;
            if (app) {
                if (app.pathEditing) {
                    e.preventDefault();
                    app.pathEditing = false;
                    return;
                }
                if (app.terminalMaximized) {
                    e.preventDefault();
                    app.terminalMaximized = false;
                    return;
                }
                if (app.showAddServer || app.openServerManager || app.showMkdir || app.showNewFile || app.activeItem || app.showEditor || app.showQRScanner || app.showTerminal) {
                    e.preventDefault();
                    app.showAddServer = false;
                    app.openServerManager = false;
                    app.showMkdir = false;
                    app.showNewFile = false;
                    app.activeItem = null;
                    app.showEditor = false;
                    app.showTerminal = false;
                    app.stopQRScanner(); // Ensure scanner stops
                } else if (app.currentPath && app.currentPath !== '/') {
                    e.preventDefault();
                    app.navigateUp();
                } else if (app.currentServer) {
                    e.preventDefault();
                    app.currentServer = null;
                }
            }
        });

        document.addEventListener('alpine:init', () => {
            Alpine.data('ftpApp', () => ({
                servers: JSON.parse(localStorage.getItem('ftp_servers') || '[]'),
                currentServer: null,
                showAddServer: false,
                showMkdir: false,
                showNewFile: false,
                newFolderName: '',
                activeItem: null,
                tempServer: { name: '', url: '', domainUrl: '', protocol: 'https://', apiKey: '' },
                showEditor: false,
                editingFile: null,
                fileContent: '',
                showRemoteUpload: false,
                remoteUrl: '',
                bookmarks: [],

                editingServerIdx: null,
                currentPath: '/',
                files: [],
                loading: false,
                selectedItems: [],
                openServerManager: false,
                showQRScanner: false,
                qrScanStream: null,
                showTerminal: false,
                pathEditing: false,
                pathInput: '',
                terminalLoading: false,
                terminalInput: '',
                terminalMaximized: false,
                terminalUser: 'user',
                terminalHost: 'server',
                terminalActiveTab: 0,
                terminalTabs: [
                    { id: 1, name: 'bash', cwd: '', history: [], historyIdx: -1, logs: [] }
                ],
                terminalCwd: '',
                terminalEnabled: true,


                get pathSegments() {
                    return this.currentPath === '/' ? [] : this.currentPath.split('/').filter(p => p);
                },
                get subfolders() {
                    return this.files.filter(f => f.type === 'directory');
                },

                toggleSelection(item) {
                    window.haptic('impactLight');
                    const idx = this.selectedItems.findIndex(i => i.name === item.name);
                    if (idx > -1) {
                        this.selectedItems.splice(idx, 1);
                    } else {
                        this.selectedItems.push(item);
                    }
                },

                clearSelection() {
                    this.selectedItems = [];
                },


                async init() {
                    // Trigger fingerprint/biometric authentication on app launch
                    if (window.Fingerprint) {
                        try {
                            await new Promise((resolve, reject) => {
                                window.Fingerprint.isAvailable(() => {
                                    window.Fingerprint.show({
                                        clientId: "ServerLuxe",
                                        clientSecret: "password",
                                        disableBackup: true,
                                        title: 'Authenticate',
                                        subtitle: 'Unlock Application'
                                    }, () => resolve(), (err) => reject(err));
                                }, (error) => {
                                    console.log('Biometric auth not available, skipping.', error);
                                    resolve();
                                });
                            });
                        } catch (e) {
                            console.log('Biometric auth failed or cancelled:', e);
                            window.haptic('error');
                            window.uiAlert('Authentication cancelled. App will close.');
                            if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App) {
                                window.Capacitor.Plugins.App.exitApp();
                            }
                            return;
                        }
                    }

                    let saved = localStorage.getItem('fileluxe_mobile_bookmarks');
                    if (saved) this.bookmarks = JSON.parse(saved);

                    let last = localStorage.getItem('ftp_last_server');
                    // Start manually; removed autoselect.
                },

                async startQRScanner() {
                    // Check for secure context (required for camera)
                    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1' && !window.location.protocol.includes('capacitor')) {
                        window.uiAlert('Camera access requires a secure connection (HTTPS). If you are using an IP address, please use HTTPS.');
                        return;
                    }

                    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                        window.uiAlert('Your browser or device does not support camera access.');
                        return;
                    }

                    try {
                        // Fallback to pure HTML5 permission stream
                        // Trigger permission prompt immediately to preserve user gesture
                        const stream = await navigator.mediaDevices.getUserMedia({
                            video: {
                                facingMode: 'environment',
                                width: { ideal: 1280 },
                                height: { ideal: 720 }
                            }
                        });

                        this.qrScanStream = stream;
                        this.showQRScanner = true;
                        this.openServerManager = false;

                        this.$nextTick(() => {
                            const video = document.getElementById('qrVideo');
                            if (video) {
                                video.srcObject = stream;
                                video.setAttribute('playsinline', true);
                                video.play();
                                this.scanLoop();
                            }
                        });
                    } catch (err) {
                        console.error('Camera Error:', err);
                        let msg = 'Camera access failed: ' + err.message;
                        if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                            msg = 'CAMERA PERMISSION DENIED.\n\nPlease fix this:\n1. Open Android SETTINGS\n2. Go to APPS > FMLuxe\n3. Select PERMISSIONS\n4. Select CAMERA > ALLOW';
                        } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                            msg = 'No camera found on this device.';
                        } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
                            msg = 'Camera is already in use or busy. Please close other apps using the camera.';
                        }
                        window.uiAlert(msg);
                        this.showQRScanner = false;
                    }
                },


                stopQRScanner() {
                    this.showQRScanner = false;
                    if (this.qrScanStream) {
                        this.qrScanStream.getTracks().forEach(track => track.stop());
                        this.qrScanStream = null;
                    }
                },

                scanLoop() {
                    if (!this.showQRScanner) return;
                    const video = document.getElementById('qrVideo');
                    const canvas = document.getElementById('qrCanvas');
                    if (video.readyState === video.HAVE_ENOUGH_DATA) {
                        canvas.height = video.videoHeight;
                        canvas.width = video.videoWidth;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                        const code = jsQR(imageData.data, imageData.width, imageData.height, {
                            inversionAttempts: 'attemptBoth',
                        });
                        if (code) {
                            try {
                                const data = JSON.parse(code.data);
                                if (data.url && data.name) {
                                    // Check for correct QR type (File Manager expects 'fm' type)
                                    if (data.type && data.type !== 'fm') {
                                        window.haptic('error');
                                        this.stopQRScanner();
                                        window.uiAlert('Invalid QR Type: This QR is for ' + (data.type === 'sql' ? 'SQL Manager' : data.type) + '. Please use the correct app section.');
                                        return;
                                    }

                                    window.haptic('success');
                                    this.stopQRScanner();
                                    this.tempServer = {
                                        name: data.name,
                                        url: data.url,
                                        apiKey: data.apiKey || '', // Note: API key not auto-populated from QR code anymore
                                        protocol: data.url.startsWith('https') ? 'https://' : 'http://',
                                        domainUrl: data.url.replace('https://', '').replace('http://', '')
                                    };
                                    this.showAddServer = true;
                                    window.uiAlert('QR Code Scanned! Server details filled.');
                                    return;
                                }
                            } catch (e) {
                                // Not a valid JSON or doesn't have required fields, keep scanning
                            }
                        }
                    }
                    requestAnimationFrame(() => this.scanLoop());
                },

                async exportNodes() {
                    if (this.servers.length === 0) {
                        return window.uiAlert('No nodes to export.');
                    }

                    const now = new Date();
                    const dateStr = String(now.getDate()).padStart(2, '0') + '-' +
                        String(now.getMonth() + 1).padStart(2, '0') + '-' +
                        now.getFullYear();
                    const defaultName = `ServerLuxe-(${dateStr}).json`;

                    const fileName = await window.uiPrompt("Enter filename to save:", defaultName);
                    if (!fileName) return;

                    try {
                        const dataStr = JSON.stringify(this.servers, null, 2);
                        const blob = new Blob([dataStr], { type: 'application/json' });

                        // If browser supports Modern File System Access API
                        if (window.showSaveFilePicker) {
                            try {
                                const handle = await window.showSaveFilePicker({
                                    suggestedName: fileName,
                                    types: [{
                                        description: 'JSON Files',
                                        accept: { 'application/json': ['.json'] },
                                    }],
                                });
                                const writable = await handle.createWritable();
                                await writable.write(blob);
                                await writable.close();
                                return;
                            } catch (e) {
                                // Fallback to standard download if user cancels or API fails
                                if (e.name === 'AbortError') return;
                            }
                        }

                        // Fallback: Standard anchor download
                        const url = URL.createObjectURL(blob);
                        const dlAnchorElem = document.createElement('a');
                        dlAnchorElem.setAttribute("href", url);
                        dlAnchorElem.setAttribute("download", fileName.endsWith('.json') ? fileName : fileName + '.json');
                        document.body.appendChild(dlAnchorElem);
                        dlAnchorElem.click();
                        setTimeout(() => {
                            document.body.removeChild(dlAnchorElem);
                            URL.revokeObjectURL(url);
                        }, 100);
                    } catch (err) {
                        window.uiAlert('Export failed: ' + err.message);
                    }
                },


                importNodes(ev) {
                    const file = ev.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();

                        try {
                            const imported = JSON.parse(re.target.result);
                            if (Array.isArray(imported)) {
                                this.servers = imported;
                                localStorage.setItem('ftp_servers', JSON.stringify(this.servers));
                                window.uiAlert('Nodes successfully imported!');
                            } else {
                                window.uiAlert('Invalid file: Root element must be an array.');
                            }
                        } catch (err) {
                            window.uiAlert('Import error: ' + err.message);
                        }
                    };
                    reader.onerror = () => window.uiAlert('Failed to read file.');
                    reader.readAsText(file);
                    ev.target.value = '';
                },

                async apiReq(params, method = 'POST', isFormData = false) {
                    if (!this.currentServer) return null;
                    this.loading = true;
                    try {
                        let url = new URL(this.currentServer.url);
                        let headers = {
                            'X-API-KEY': this.currentServer.apiKey || '2026'
                        };

                        let body = null;

                        if (method === 'GET') {
                            Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
                            if (this.currentServer.apiKey) {
                                url.searchParams.append('api_key', this.currentServer.apiKey);
                            }
                        } else {
                            if (isFormData) {
                                body = params; // params is already FormData
                                if (this.currentServer.apiKey && !body.has('api_key')) {
                                    body.append('api_key', this.currentServer.apiKey);
                                }
                            } else {
                                body = new FormData();
                                Object.keys(params).forEach(k => body.append(k, params[k]));
                                if (this.currentServer.apiKey) {
                                    body.append('api_key', this.currentServer.apiKey);
                                }
                            }
                        }

                        let res = await fetch(url, { method, headers, body });
                        let data = await res.json();
                        this.loading = false;
                        if (data.error) {
                            window.uiAlert(data.error);
                            return null;
                        }
                        return data;
                    } catch (e) {
                        this.loading = false;
                        window.uiAlert("API Error: " + e.message);
                        return null;
                    }
                },

                async fetchFiles(path = '') {

                    let res = await this.apiReq({ ajax: 'files', path: path }, 'GET');
                    if (res && res.success) {

                        this.files = res.files;
                        this.currentPath = res.pwd;
                    }
                },

                navigateTo(path) {
                    this.fetchFiles(path);
                },

                navigateUp() {
                    if (this.currentPath === '/') {
                        this.navigateTo('/..');
                    } else if (this.currentPath.endsWith('..')) {
                        this.navigateTo(this.currentPath + '/..');
                    } else {
                        let parts = this.currentPath.split('/');
                        parts.pop();
                        this.navigateTo(parts.join('/') || '/');
                    }
                },

                navigateToSegment(index) {
                    let parts = this.pathSegments.slice(0, index + 1);
                    this.navigateTo('/' + parts.join('/'));

                enablePathEdit() {

                cancelPathEdit() {

                async gotoPath(inputPath = null) {
                    let p = (inputPath !== null ? inputPath : this.pathInput || '').trim();
                    if (!p) return;

                    // Handle relative paths
                    if (!p.startsWith('/') && !p.startsWith('~') && !p.match(/^[a-zA-Z]:/)) {
                        let base = this.currentPath || '/';
                        p = base === '/' ? '/' + p : base + '/' + p;
                    }

                    this.loading = true;
                    try {
                        let res = await this.apiReq({ ajax: 'resolve_path', path: p }, 'GET');
                        if (res && res.success) {
                            this.pathEditing = false;
                            if (res.type === 'directory') {
                                await this.fetchFiles(res.path);
                                window.haptic('success');
                            } else if (res.type === 'file') {
                                await this.fetchFiles(res.parent);
                                await this.inspectFileByPath(res.path, { name: res.name, size: res.size, date: res.date });
                                window.haptic('success');
                            }
                        } else {
                            // Fallback: try navigating directly via files
                            let fetchRes = await this.apiReq({ ajax: 'files', path: p }, 'GET');
                            if (fetchRes && fetchRes.success) {
                                this.files = fetchRes.files;
                                this.currentPath = fetchRes.pwd;
                                this.pathEditing = false;
                                window.haptic('success');
                            } else if (fetchRes && fetchRes.is_file) {
                                this.pathEditing = false;
                                await this.fetchFiles(fetchRes.parent);
                                await this.inspectFileByPath(fetchRes.file_path);
                            } else {
                                window.uiAlert(res?.error || fetchRes?.error || 'Path not found: ' + p);
                            }
                        }
                    } catch(e) {
                        window.uiAlert('Error resolving path: ' + (e.message || e));
                    } finally {
                        this.loading = false;
                    }
                },

                formatSize(bytes) {
                    if (bytes === 0) return '0 B';
                    const k = 1024;
                    const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                    const i = Math.floor(Math.log(bytes) / Math.log(k));
                    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
                },

                    this.activeItem = item;

                async inspectFile(item) {

                    let target = this.currentPath === '/' ? '/' + item.name : this.currentPath + '/' + item.name;

                async inspectFileByPath(target, item = null) {
                    this.loading = true;
                    let res = await this.apiReq({ action: 'read', file: target });
                    this.loading = false;
                    if (res && res.success) {
                        this.editingFile = { name: target.split('/').pop(), ...item, fullPath: target };
                        // Decode base64 to string safely
                        try {
                            this.fileContent = decodeURIComponent(atob(res.content).split('').map(function (c) {
                                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                            }).join(''));
                            this.showEditor = true;
                        } catch (e) {
                            window.uiAlert("File is binary or uses an unsupported encoding.");
                        }
                    } else {
                        window.uiAlert(res?.error || "Failed to read file.");
                    }
                },

                async saveFileContent() {
                    // Encode back to base64
                    let base64Content = btoa(encodeURIComponent(this.fileContent).replace(/%([0-9A-F]{2})/g,
                        function toSolidBytes(match, p1) {
                            return String.fromCharCode('0x' + p1);
                        }));
                    let res = await this.apiReq({ action: 'write', file: this.editingFile.fullPath, content: base64Content });
                    if (res && res.success) {
                        window.uiAlert('Saved successfully!');
                        this.showEditor = false;
                        this.fetchFiles(this.currentPath);
                    }

                    action.name = 'action';
                    action.value = 'download';

                    const fileInput = document.createElement('input');
                    fileInput.type = 'hidden';
                    fileInput.name = 'file';
                    fileInput.value = target;

                    form.appendChild(action);
                    form.appendChild(fileInput);

                    if (this.currentServer && this.currentServer.apiKey) {
                        const keyInput = document.createElement('input');
                        keyInput.type = 'hidden';
                        keyInput.name = 'api_key';
                        keyInput.value = this.currentServer.apiKey;
                        form.appendChild(keyInput);

                    document.body.appendChild(form);
                    form.submit();
                    document.body.removeChild(form);

                // Terminal Methods
                async openTerminal() {
                    if (!this.currentServer) {
                        return window.uiAlert("Please connect to a server first.");
                    }
                    this.showTerminal = true;
                    if (!this.terminalCwd) {
                        this.terminalCwd = this.currentPath || '/';
                    }
                    if (this.terminalTabs.length === 0) {
                        this.terminalTabs = [{ id: Date.now(), name: 'bash', cwd: this.terminalCwd, history: [], historyIdx: -1, logs: [] }];
                        this.terminalActiveTab = 0;
                    }
                    const activeTab = this.terminalTabs[this.terminalActiveTab] || this.terminalTabs[0];
                    if (activeTab && activeTab.logs.length === 0) {
                        activeTab.logs.push({
                            type: 'system-banner',
                            text: 'Connected to ' + (this.currentServer.name || 'Server') + ' Terminal (' + (navigator.platform || 'App') + ')\nType commands or press Tab for auto-completion.'
                        });
                    }
                    if (this.currentServer.name) {
                        this.terminalHost = this.currentServer.name.toLowerCase().replace(/[^a-z0-9_-]/g, '');
                    }
                    // Fetch latest terminal status and system info from server
                    try {
                        const data = await this.apiReq({ action: 'get_mcp_config' }, 'GET');
                        if (data) {
                            this.terminalEnabled = !!data.terminal_enabled;
                            if (data.terminal_info) {
                                if (data.terminal_info.user) this.terminalUser = data.terminal_info.user;
                                if (data.terminal_info.hostname) this.terminalHost = data.terminal_info.hostname;
                            }
                        }
                    } catch(e) {}
                    this.$nextTick(() => {
                        this.focusTerminal();
                        this.scrollTerminal();
                    });
                },

                focusTerminal() {
                    this.$nextTick(() => {
                        if (this.$refs.terminalCmdInput) {
                            this.$refs.terminalCmdInput.focus();
                        }
                    });
                },

                toggleMaximizeTerminal() {
                    this.terminalMaximized = !this.terminalMaximized;
                    this.focusTerminal();
                    this.scrollTerminal();
                },

                addTerminalTab() {
                    const id = Date.now();
                    const newTab = {
                        id: id,
                        name: 'bash ' + (this.terminalTabs.length + 1),
                        cwd: this.terminalCwd || this.currentPath || '/',
                        history: [],
                        historyIdx: -1,
                        logs: [{
                            type: 'system-banner',
                            text: 'Session ' + (this.terminalTabs.length + 1) + ' ready. Working directory: ' + (this.terminalCwd || '/')
                        }]
                    };
                    this.terminalTabs.push(newTab);
                    this.terminalActiveTab = this.terminalTabs.length - 1;
                    this.focusTerminal();
                    this.scrollTerminal();
                },

                closeTerminalTab(idx, event = null) {
                    if (event) event.stopPropagation();
                    if (this.terminalTabs.length <= 1) {
                        this.showTerminal = false;
                        return;
                    }
                    this.terminalTabs.splice(idx, 1);
                    if (this.terminalActiveTab >= this.terminalTabs.length) {
                        this.terminalActiveTab = this.terminalTabs.length - 1;
                    }
                    this.focusTerminal();
                    this.scrollTerminal();
                },

                switchTerminalTab(idx) {
                    this.terminalActiveTab = idx;
                    const tab = this.terminalTabs[idx];
                    if (tab && tab.cwd) {
                        this.terminalCwd = tab.cwd;
                    }
                    this.focusTerminal();
                    this.scrollTerminal();
                },

                scrollTerminal() {
                    this.$nextTick(() => {
                        if (this.$refs.terminalBody) {
                            this.$refs.terminalBody.scrollTop = this.$refs.terminalBody.scrollHeight;
                        }
                    });
                },

                clearTerminal() {
                    const tab = this.terminalTabs[this.terminalActiveTab];
                    if (tab) {
                        tab.logs = [];
                    }
                },

                async toggleTerminal(enableState = null) {
                    const target = enableState !== null ? enableState : !this.terminalEnabled;
                    this.loading = true;
                    try {
                        const res = await this.apiReq({
                            action: 'toggle_terminal',
                            enabled: target ? '1' : '0'
                        });
                        if (res && res.success) {
                            this.terminalEnabled = !!res.terminal_enabled;
                            window.haptic('success');
                            window.uiAlert(this.terminalEnabled ? 'Terminal access enabled.' : 'Terminal access disabled.');
                        } else {
                            window.uiAlert('Failed to toggle terminal: ' + (res?.error || 'Unknown error'));
                        }
                    } catch(e) {
                        window.uiAlert('Network error while toggling terminal.');
                    } finally {
                        this.loading = false;
                    }
                },

                navigateHistory(dir) {
                    const tab = this.terminalTabs[this.terminalActiveTab];
                    if (!tab || tab.history.length === 0) return;
                    if (dir === 'up') {
                        if (tab.historyIdx < tab.history.length - 1) {
                            tab.historyIdx++;
                        }
                    } else if (dir === 'down') {
                        if (tab.historyIdx > 0) {
                            tab.historyIdx--;
                        } else {
                            tab.historyIdx = -1;
                            this.terminalInput = '';
                            return;
                        }
                    }
                    if (tab.historyIdx >= 0) {
                        const rev = [...tab.history].reverse();
                        this.terminalInput = rev[tab.historyIdx] || '';
                    }
                },

                handleTerminalKey(e) {
                    // Ctrl+C / Cmd+C handling: clear active line or copy selection
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'C')) {
                        const sel = window.getSelection().toString();
                        if (!sel) {
                            const tab = this.terminalTabs[this.terminalActiveTab];
                            if (tab) {
                                tab.logs.push({
                                    type: 'cmd',
                                    cwd: tab.cwd || this.terminalCwd,
                                    text: (this.terminalInput || '') + '^C',
                                    user: this.terminalUser,
                                    hostname: this.terminalHost
                                });
                            }
                            this.terminalInput = '';
                            this.scrollTerminal();
                        }
                        return;
                    }

                    // Ctrl+L: clear screen like native terminal
                    if ((e.ctrlKey || e.metaKey) && (e.key === 'l' || e.key === 'L')) {
                        e.preventDefault();
                        this.clearTerminal();
                        return;
                    }

                    // Tab key: auto-complete filenames in cwd
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        this.autoCompleteTerminal();
                    }
                },

                autoCompleteTerminal() {
                    const input = this.terminalInput || '';
                    const parts = input.split(' ');
                    const lastToken = parts[parts.length - 1] || '';
                    if (!lastToken) return;

                    const candidates = (this.files || []).map(f => f.name).filter(n => n.startsWith(lastToken));
                    if (candidates.length === 1) {
                        parts[parts.length - 1] = candidates[0];
                        this.terminalInput = parts.join(' ');
                    } else if (candidates.length > 1) {
                        const tab = this.terminalTabs[this.terminalActiveTab];
                        if (tab) {
                            tab.logs.push({
                                type: 'stdout',
                                text: candidates.join('   ')
                            });
                            this.scrollTerminal();
                        }
                    }
                },

                runQuickCmd(cmd) {
                    this.terminalInput = cmd;
                    this.runTerminalCommand();
                },

                async runTerminalCommand() {
                    const cmd = (this.terminalInput || '').trim();
                    if (!cmd || this.terminalLoading) return;

                    const tab = this.terminalTabs[this.terminalActiveTab] || { history: [], logs: [], cwd: this.terminalCwd };

                    // Add to command history
                    tab.history.push(cmd);
                    if (tab.history.length > 100) tab.history.shift();
                    tab.historyIdx = -1;

                    // Echo command to log with rich metadata
                    const cmdCwd = tab.cwd || this.terminalCwd || this.currentPath || '/';
                    tab.logs.push({
                        type: 'cmd',
                        cwd: cmdCwd,
                        text: cmd,
                        user: this.terminalUser,
                        hostname: this.terminalHost
                    });
                    this.terminalInput = '';
                    this.terminalLoading = true;
                    this.scrollTerminal();

                    if (cmd === 'clear' || cmd === 'cls') {
                        tab.logs = [];
                        this.terminalLoading = false;
                        this.focusTerminal();
                        return;
                    }

                    if (cmd === 'exit' || cmd === 'quit') {
                        this.terminalLoading = false;
                        this.closeTerminalTab(this.terminalActiveTab);
                        return;
                    }

                    try {
                        const res = await this.apiReq({
                            action: 'terminal_exec',
                            cmd: cmd,
                            cwd: cmdCwd
                        });

                        if (res) {
                            if (res.cwd) {
                                tab.cwd = res.cwd;
                                this.terminalCwd = res.cwd;
                            }
                            if (res.user) this.terminalUser = res.user;
                            if (res.hostname) this.terminalHost = res.hostname;

                            if (res.stdout) {
                                tab.logs.push({ type: 'stdout', text: res.stdout });
                            }
                            if (res.stderr) {
                                tab.logs.push({ type: 'stderr', text: res.stderr });
                            }
                            if (res.error && !res.stdout && !res.stderr) {
                                tab.logs.push({ type: 'error', text: res.error });
                            }
                            if (typeof res.exit_code !== 'undefined' && res.exit_code !== 0) {
                                tab.logs.push({ type: 'exit-info', exitCode: res.exit_code });
                            }
                            if (res.success && (cmd.startsWith('mkdir') || cmd.startsWith('touch') || cmd.startsWith('rm') || cmd.startsWith('git pull') || cmd.startsWith('mv') || cmd.startsWith('cp') || cmd.startsWith('unzip'))) {
                                this.fetchFiles(this.currentPath);
                            }
                        } else {
                            tab.logs.push({ type: 'error', text: 'Error: No response or execution failed.' });
                        }
                    } catch(e) {
                        tab.logs.push({ type: 'error', text: 'Error: ' + (e.message || e) });
                    } finally {
                        this.terminalLoading = false;
                        this.scrollTerminal();
                        this.focusTerminal();
                    }
                }
            }));
        });
    </script>
